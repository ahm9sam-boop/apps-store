<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apps Store</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:#fff;color:#1f1f1f}
a{text-decoration:none;color:inherit}
header{position:sticky;top:0;background:#fff;z-index:10;border-bottom:1px solid #e8e8e8;padding:10px 16px;display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:20px;color:#01875f;display:flex;align-items:center;gap:8px;cursor:pointer}
header h1 small{font-size:11px;color:#5f6368;font-weight:normal}
#search{flex:1;max-width:420px;border:0;background:#f1f3f4;border-radius:22px;padding:10px 18px;font-size:14px;font-family:inherit;outline:none}
main{max-width:760px;margin:auto;padding:16px}
.card{display:flex;align-items:center;gap:14px;padding:14px 8px;border-bottom:1px solid #f0f0f0;cursor:pointer}
.card:hover{background:#f8f9fa}
.card img{width:56px;height:56px;border-radius:14px;background:#f1f3f4;flex:none}
.card .inf{flex:1;min-width:0}
.card h3{margin:0;font-size:15px;font-weight:600}
.card small{display:block;color:#5f6368;font-size:12px;margin-top:3px}
.stars{color:#f9ab00;font-size:13px;letter-spacing:1px}
.stars .n{color:#5f6368;font-size:12px;letter-spacing:0}
.badge{background:#e6f4ea;color:#137333;border-radius:10px;font-size:11px;padding:2px 8px}
.btn{display:inline-block;border:0;cursor:pointer;font-family:inherit;background:#01875f;color:#fff;font-size:14px;font-weight:600;padding:9px 26px;border-radius:20px;text-align:center}
.btn.ghost{background:#fff;color:#01875f;border:1px solid #dadce0}
.btn.dis{background:#f1f3f4!important;color:#9aa0a6!important;cursor:default}
.btnrow{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
.dhead{display:flex;gap:16px;align-items:flex-start;margin-top:8px}
.dhead img{width:84px;height:84px;border-radius:20px;background:#f1f3f4;flex:none}
.dhead h2{margin:0 0 4px;font-size:22px}
.dev{color:#01875f;font-size:13px;font-weight:600}
.dmeta{display:flex;gap:0;margin:16px 0;border-top:1px solid #f0f0f0;border-bottom:1px solid #f0f0f0}
.dmeta div{flex:1;text-align:center;padding:10px 4px;border-inline-start:1px solid #f0f0f0}
.dmeta div:first-child{border-inline-start:0}
.dmeta b{display:block;font-size:14px}
.dmeta span{font-size:11px;color:#5f6368}
.shots{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 12px;scrollbar-width:thin}
.shots img{height:260px;border-radius:12px;border:1px solid #eee;flex:none}
.sec{margin:18px 0}
.sec h3{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.sec p{font-size:14px;line-height:1.9;color:#3c4043;margin:0}
.muted{color:#5f6368;font-size:12px}
.rbox{display:flex;gap:24px;align-items:center;background:#f8f9fa;border-radius:16px;padding:16px;margin-bottom:12px}
.rbig{font-size:44px;font-weight:700}
.rbars{flex:1}
.rbar{display:flex;align-items:center;gap:8px;font-size:11px;color:#5f6368}
.rbar .tr{flex:1;height:8px;background:#e8eaed;border-radius:4px;overflow:hidden}
.rbar .fl{height:100%;background:#f9ab00}
.rev{border-top:1px solid #f0f0f0;padding:12px 0;font-size:13px}
.rev b{font-size:13px}
.rev p{margin:4px 0 0;color:#3c4043;line-height:1.8}
.revform{background:#f8f9fa;border-radius:16px;padding:14px;margin-top:10px}
.revform input,.revform textarea{width:100%;border:1px solid #dadce0;border-radius:10px;padding:9px 12px;font-family:inherit;font-size:13px;margin-bottom:8px;background:#fff;outline:none}
.revform textarea{min-height:70px;resize:vertical}
.starinput{font-size:24px;color:#dadce0;cursor:pointer;letter-spacing:4px;margin-bottom:8px;user-select:none}
.starinput span.on{color:#f9ab00}
table.info{width:100%;border-collapse:collapse;font-size:13px}
table.info td{padding:8px 4px;border-bottom:1px solid #f0f0f0;color:#3c4043}
table.info td:first-child{color:#5f6368;width:40%}
code{display:block;direction:ltr;word-break:break-all;background:#f1f3f4;padding:8px;border-radius:8px;font-size:11px}
details{margin-top:10px;font-size:13px}
summary{cursor:pointer;color:#5f6368}
.back{border:0;background:none;font-size:22px;cursor:pointer;color:#5f6368;padding:4px 8px}
.how{background:#e8f0fe;border-radius:14px;padding:12px 14px;font-size:12.5px;color:#1a3c74;line-height:1.9;margin-top:14px}
.how b{display:block;margin-bottom:4px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#202124;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;display:none;z-index:50}
</style></head><body>
<header><h1 onclick="location.hash=''">&#9654; Apps Store <small>تطبيقات أندرويد مجانية</small></h1><input id="search" placeholder="ابحث عن تطبيق" oninput="home(this.value)"></header>
<main id="app"></main>
<div id="toast"></div>
<script>
var STORE_V='2026-11-27b';
(function(){try{fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){var m=t.match(/STORE_V='([^']+)'/);if(m&&m[1]!==STORE_V&&sessionStorage.getItem('sv')!==m[1]){sessionStorage.setItem('sv',m[1]);location.replace(location.pathname+'?v='+Date.now());}}).catch(function(){})}catch(e){}})();
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var APPS=[];
var K=function(p){return 'inst_'+p};
function getLS(p){try{return JSON.parse(localStorage.getItem(K(p)))}catch(e){return null}}
function setLS(p,v){try{localStorage.setItem(K(p),JSON.stringify(v))}catch(e){}}
var REV_API='https://script.google.com/macros/s/AKfycbyuww8gLTOZKGt-b0dkpAD9307G4fHimNk-ITbzZozTRhx01_DuF-B-_pLeHzB7N9Ni/exec';
var REV_CACHE={};
function revFetch(pkg,cb){var id='rcb'+Math.floor(Math.random()*1e9);window[id]=function(d){d._t=Date.now();REV_CACHE[pkg]=d;try{delete window[id]}catch(e){window[id]=undefined}cb&&cb(d)};var s=document.createElement('script');s.src=REV_API+'?pkg='+encodeURIComponent(pkg)+'&callback='+id+'&t='+Date.now();s.onerror=function(){cb&&cb(null)};document.body.appendChild(s)}
function revRefresh(pkg){revFetch(pkg,function(d){if(!d)return;var m=location.hash.match(/app=([\w.]+)/);if(m&&m[1]===pkg)detail(pkg)})}
if(location.search.indexOf('notinstalled')>-1){try{Object.keys(localStorage).filter(function(k){return k.indexOf('inst_')==0}).forEach(function(k){localStorage.removeItem(k)})}catch(e){}try{history.replaceState(null,'',location.pathname)}catch(e){}}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2500)}
function starStr(r){var f=Math.round(r||0),s='';for(var i=1;i<=5;i++)s+=i<=f?'★':'☆';return s}
function ratingLine(x){if(!x.rating)return '<span class="badge">جديد</span>';return '<span class="stars">'+starStr(x.rating)+' <span class="n">'+x.rating+'</span></span>'}
function btnFor(x){
  if(x.locked)return '<span class="btn dis">مقفول مؤقتاً</span>';
  var st=getLS(x.pkg),h='';
  if(st&&st.code&&x.code>st.code)h+='<button class="btn" onclick="dl(\''+esc(x.pkg)+'\')">تحديث</button>';
  else if(st&&st.code)h+='<button class="btn ghost" onclick="opn(\''+esc(x.pkg)+'\')">فتح</button>';
  else h+='<button class="btn" onclick="dl(\''+esc(x.pkg)+'\')">تثبيت</button>';
  if(st&&st.code)h+='<button class="btn ghost" onclick="uninst(\''+esc(x.pkg)+'\')">إلغاء التثبيت</button>';
  return h;
}
function findApp(p){for(var i=0;i<APPS.length;i++)if(APPS[i].pkg===p)return APPS[i];return null}
function dl(pkg){var x=findApp(pkg);if(!x||!x.apk)return;setLS(pkg,{code:x.code||0,ts:Date.now()});var a=document.createElement('a');a.href=x.apk;a.download='';document.body.appendChild(a);a.click();a.remove();toast('بدأ التحميل…');setTimeout(route,800)}
function opn(pkg){location.href='intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package='+pkg+';S.browser_fallback_url='+encodeURIComponent(location.protocol+'//'+location.host+location.pathname+'?notinstalled=1')+';end'}
function uninst(pkg){location.href='intent://'+pkg+'#Intent;scheme=package;action=android.intent.action.DELETE;end';setTimeout(function(){var s=getLS(pkg);if(s){localStorage.removeItem(K(pkg));route()}},4000)}
function home(q){
  var h='<div class="how"><b>طريقة التثبيت</b>١) اضغط "تثبيت" وافتح الملف بعد التحميل. ٢) لو ظهر تحذير أمان، فعّل "السماح من هذا المصدر" ثم أكمل التثبيت.</div>';
  var list=APPS.filter(function(x){return !q||x.name.indexOf(q)>-1});
  if(!list.length)h+='<p class="muted" style="text-align:center;padding:30px">لا توجد نتائج</p>';
  list.forEach(function(x){
    h+='<div class="card" onclick="location.hash=\'app='+esc(x.pkg)+'\'"><img src="'+esc(x.icon)+'" alt="" loading="lazy"><div class="inf"><h3>'+esc(x.name)+'</h3><small>'+esc(x.category||'أدوات')+' · '+esc(x.size)+'</small><small>'+ratingLine(x)+(x.downloads?' · <span class="n">'+esc(x.downloads)+' تحميل</span>':'')+'</small></div>'+(x.locked?'<span class="btn dis">قريباً</span>':'<span class="btn ghost">عرض</span>')+'</div>';
  });
  document.getElementById('app').innerHTML=h;
}
function bars(r){
  var c=(r&&r.counts)||[0,0,0,0,0],tot=0;c.forEach(function(n){tot+=n});
  var h='';for(var i=5;i>=1;i--){var p=tot?Math.round(100*(c[i-1]||0)/tot):0;h+='<div class="rbar"><span>'+i+'</span><div class="tr"><div class="fl" style="width:'+p+'%"></div></div><span>'+(c[i-1]||0)+'</span></div>'}
  return h;
}
function myReviews(pkg){var r=getLS('rev_'+pkg);return Array.isArray(r)?r:[]}
function detail(pkg){
  var x=findApp(pkg);if(!x){location.hash='';return}
  var rv=REV_CACHE[pkg];
  var rating=rv?rv.rating:x.rating,rcount=rv?rv.ratings_count:x.ratings_count,rcounts=rv?rv.counts:x.rating_bars;
  var base=rv?rv.reviews:(x.reviews||[]),seen={};
  base.forEach(function(r){seen[(r.name||'')+'|'+(r.text||'')]=1});
  var revs=base.concat(myReviews(pkg).filter(function(r){return !seen[(r.name||'')+'|'+(r.text||'')]}));
  var h='<button class="back" onclick="location.hash=\'\'">→</button>';
  h+='<div class="dhead"><img src="'+esc(x.icon)+'" alt=""><div><h2>'+esc(x.name)+'</h2><div class="dev">'+esc(x.developer||'Apps Store')+'</div><div class="muted">'+(x.beta?'نسخة تجريبية · ':'')+(x.contains_ads?'يحتوي على إعلانات':'بدون إعلانات')+'</div></div></div>';
  h+='<div class="dmeta"><div><b>'+(rating?rating+' ★':'جديد')+'</b><span>'+(rcount?rcount+' مراجعة':'التقييم')+'</span></div><div><b>'+esc(x.downloads||'—')+'</b><span>تحميل</span></div><div><b>'+esc(x.size)+'</b><span>الحجم</span></div></div>';
  h+='<div class="btnrow">'+btnFor(x)+'</div>';
  if(x.locked)h+='<p class="muted">التطبيق قيد التطوير وسيتاح قريباً.</p>';
  if(x.screenshots&&x.screenshots.length){h+='<div class="shots">'+x.screenshots.map(function(s){return '<img src="'+esc(s)+'" loading="lazy" alt="">'}).join('')+'</div>'}
  h+='<div class="sec"><h3>حول هذا التطبيق</h3><p>'+esc(x.desc)+'</p></div>';
  if(x.whats_new)h+='<div class="sec"><h3>ما الجديد</h3><p>'+esc(x.whats_new)+'</p></div>';
  h+='<div class="sec"><h3>التقييمات والمراجعات</h3>';
  h+='<div class="rbox"><div style="text-align:center"><div class="rbig">'+(rating||'—')+'</div><div class="stars">'+starStr(rating||0)+'</div><div class="muted">'+(rcount||0)+' مراجعة</div></div><div class="rbars">'+bars(rcounts)+'</div></div>';
  if(revs.length){revs.forEach(function(r){h+='<div class="rev"><b>'+esc(r.name||'مستخدم')+'</b> <span class="stars">'+starStr(r.stars)+'</span><p>'+esc(r.text)+'</p></div>'})}
  else h+='<p class="muted">لا توجد مراجعات بعد. كن أول من يقيّم!</p>';
  h+='<div class="revform"><b style="font-size:13px">قيّم هذا التطبيق</b><div class="starinput" id="si"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div><input id="rn" placeholder="اسمك (اختياري)"><textarea id="rt" placeholder="اكتب مراجعتك…"></textarea><button class="btn" onclick="postRev(\''+esc(x.pkg)+'\')">نشر المراجعة</button><div class="muted" style="margin-top:6px">تُنشر مراجعتك وتظهر لكل زوار المتجر.</div></div></div>';
  h+='<div class="sec"><h3>معلومات التطبيق</h3><table class="info"><tr><td>الإصدار</td><td>'+esc(x.version)+'</td></tr>'+(x.updated?'<tr><td>آخر تحديث</td><td>'+esc(x.updated)+'</td></tr>':'')+'<tr><td>الحجم</td><td>'+esc(x.size)+'</td></tr><tr><td>الحزمة</td><td dir="ltr">'+esc(x.pkg)+'</td></tr></table>';
  if(x.perms)h+='<details><summary>الأذونات ('+x.perms.length+')</summary><ul>'+x.perms.map(function(p){return '<li>'+esc(p)+'</li>'}).join('')+'</ul></details>';
  if(x.sha256)h+='<details><summary>SHA-256</summary><code>'+esc(x.sha256)+'</code></details>';
  h+='</div>';
  document.getElementById('app').innerHTML=h;
  var si=document.getElementById('si'),cur=0;
  si.onclick=function(e){if(e.target.tagName!=='SPAN')return;cur=Array.prototype.indexOf.call(si.children,e.target)+1;Array.prototype.forEach.call(si.children,function(s,i){s.className=i<cur?'on':''});si.dataset.v=cur};
  if(!rv||Date.now()-(rv._t||0)>60000)revRefresh(pkg);
}
function postRev(pkg){
  var st=+(document.getElementById('si').dataset.v||0),tx=document.getElementById('rt').value.trim(),nm=document.getElementById('rn').value.trim();
  if(!st){toast('اختار عدد النجوم أولاً');return}
  if(!tx){toast('اكتب مراجعتك أولاً');return}
  var r=myReviews(pkg);r.unshift({name:nm||'مستخدم',stars:st,text:tx});setLS('rev_'+pkg,r);
  try{fetch(REV_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({pkg:pkg,name:nm||'مستخدم',stars:st,text:tx})})}catch(e){}
  delete REV_CACHE[pkg];
  toast('شكراً! تم نشر مراجعتك');detail(pkg);
  setTimeout(function(){revRefresh(pkg)},2500);
}
function route(){var m=location.hash.match(/app=([\w.]+)/);if(m)detail(m[1]);else home(document.getElementById('search').value)}
window.addEventListener('hashchange',route);
var xr=new XMLHttpRequest();xr.open('GET','apps.json?t='+Date.now());xr.setRequestHeader('Cache-Control','no-cache');
xr.onload=function(){try{APPS=JSON.parse(xr.responseText)}catch(e){}route()};xr.onerror=function(){document.getElementById('app').innerHTML='<p class="muted">تعذر تحميل القائمة</p>'};xr.send();
</script></body></html>
